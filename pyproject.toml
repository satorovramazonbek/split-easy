[project]
name = "split-easy"
version = "0.1.0"
description = "Group expense splitting application"
authors = [
    { name = "Ramazonbek", email = "romajansatorov@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "pydantic>=2.10,<3.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.20,<1.0",
    "pyjwt (>=2.10,<3.0)",
    "argon2-cffi (>=23.1,<26.0)",
    "email-validator (>=2.2,<3.0)"
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.9,<1.0",
    "black>=25.0,<27.0",
    "httpx>=0.28,<1.0",
    "pillow (>=11.0,<13.0)"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# NFR-3: every function in app/ has type hints (ANN). Tests, migrations and
# scripts are exempt below.
extend-select = ["ANN"]
ignore = ["ANN401"]  # Any is allowed where a value really can be anything

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "F811"]  # pytest fixtures are imported and used as params
"migrations/**" = ["ANN"]
"scripts/**" = ["ANN"]

[tool.black]
line-length = 88

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
