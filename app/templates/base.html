<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SplitEasy{% endblock %} · SplitEasy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', path='style.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', path='pages.css') }}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-md navbar-dark navbar-se">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ '/groups' if user else '/' }}">💸 SplitEasy</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"
              aria-controls="nav" aria-expanded="false" aria-label="Menyu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          {% if user %}
          <li class="nav-item"><a class="nav-link {% block nav_groups %}{% endblock %}" href="/groups">Guruhlarim</a></li>
          {% endif %}
          <li class="nav-item"><a class="nav-link" href="/">Tezkor hisob</a></li>
        </ul>
        {% if user %}
        <div class="d-flex align-items-center gap-3">
          <span class="navbar-text text-white">👤 {{ user.username }}</span>
          <form method="post" action="/logout">
            <button type="submit" class="btn btn-sm btn-outline-light">Chiqish</button>
          </form>
        </div>
        {% else %}
        <div class="d-flex gap-2">
          <a class="btn btn-sm btn-outline-light" href="/login">Kirish</a>
          <a class="btn btn-sm btn-light" href="/register">Ro'yxatdan o'tish</a>
        </div>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container page flex-grow-1">
    {% if flash %}
    <div class="alert alert-{{ flash[0] }} alert-dismissible fade show" role="alert">
      {{ flash[1] }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Yopish"></button>
    </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">SplitEasy · guruh xarajatlarini adolatli bo'lishish</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
